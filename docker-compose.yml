services:
  # ไม่มี service mysql ในนี้ เพราะเครื่อง dev มี MySQL80 รันเป็น Windows Service อยู่แล้วบนพอร์ต 3306
  # (asset_management ตัวจริงอยู่ที่นั่น) phpMyAdmin จึงชี้ไปที่ host โดยตรงแทนที่จะสร้าง MySQL ซ้ำใน Docker
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: asset-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
